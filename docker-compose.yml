version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusguard-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/nexusguard.db
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
    volumes:
      - ./backend/nexusguard.db:/app/nexusguard.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
